    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 根据JD，生成简历评价标准
        model:
          completion_params:
            temperature: 0.7
            thinking: false
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: fdc3194e-ec29-4cb8-b265-0cc83e0c78ff
          role: system
          text: "<instruction>\n根据用户提供的职位描述（JD）信息，生成一个简历评价标准，总分为100分。评价标准应包含至少4个维度，每个维度的分值权重根据JD中的明确要求进行调整。重点考察客观条件（如学历、工作经验、技能、项目经验等），一些软性技能，如工作态度、团队合作、性格等这种主观条件不要出现在评分标准中。以及一些不好从简历中判断，或者一般应聘者不会写上去的评判标准也不要列上去。\n\
            以下是具体步骤：\n\n1. **提取JD中的关键条件**：从JD中识别明确要求的条件（如学历、工作经验年限、技能、项目经验等），并将这些条件作为高权重维度。\n\
            2. **定义评价维度**：至少选择4个维度，例如：学历、工作经验、技能匹配度、证书/资格、语言能力等。每个维度的分值权重根据JD中的重要性分配。\n\
            3. **设置评分规则**：\n   - 对于JD中明确要求的条件（如“学历要求本科及以上”，“项目经验3年及以上”），不符合的直接打0分。反之，JD中没有明确要求，则分层次打分，如本科及以上20分，大专以上：10分，其他：0分。\n\
            \   - 其他维度根据匹配程度打分（如完全匹配100%，部分匹配50%等）。\n4. **分配权重**：将总分100分分配到各维度，JD中明确要求的条件权重应高于其他条件。\n\
            5. **生成评价标准**：以markdown列表形式输出评分标准，包含维度名称、分值权重、评分规则和说明。\n\n输出时不要包含任何XML标签，仅提供纯文本格式的评价标准。\n\
            </instruction>"
