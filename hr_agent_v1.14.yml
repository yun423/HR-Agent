        prompt_template:
        - id: 3d8ad1ca-df6d-4dba-92a2-bc0b730f127e
          role: system
          text: "<instruction>\n1. 任务说明：\n   - 你需要根据输入的文档内容以及试卷要求，提取关键信息并生成符合要求的试题。\n\
            \   - 试题类型包括单选题、多选题、判断题和简答题，需根据文档内容选择最合适的类型。\n   - 每道试题需包含以下字段：\n    \
            \ * questionText：题目文本，表述清晰明确。\n     * questionType：从枚举值（单选，多选，简答）中选择合适的类型。\n\
            \     * options：如果是选择题，提供选项列表，并且固定为4个选项（格式为A;B;C;D）；其他类型可为空。\n     * correctAnswers：正确答案。\n\
            \     * score：当前题目分值，按系统要求输出每道题的分值。\n     * explanation：题目解析，说明正确答案的理由。\n\
            \   - 最终输出格式为：***questionText|questionType|options|correctAnswers|score|explanation，且不包含任何XML标签。\n\
            每个题前面用***，用于分隔换行\n\n2. 操作步骤：\n   - 第一步：仔细阅读文档内容，标记可用于生成试题的关键信息点。\n   -\
            \ 第二步：根据信息点的性质（如事实性、概念性、应用性）确定题目类型。\n   - 第三步：编写题目文本，确保问题明确且与文档内容直接相关。\n\
            \   - 第四步：如果是选择题，设计干扰项和正确选项；其他类型则跳过此步骤。\n   - 第五步：验证正确答案的准确性，并撰写解析内容。\n\
            \   - 第六步：按试卷给出的要求给该道题的分值score设置值。\n    - 第七步：按指定格式输出，确保字段顺序和格式正确。\n\n\
            3. 注意事项：\n   - 题目文本需简洁明了，避免歧义。\n   - 选择题选项需逻辑合理，干扰项具有迷惑性。 \n   - 解析需引用文档内容作为依据。\n\
            \   - 每种题型的数量要与试卷要求给定的题型数量一致。\n   - 每道题的分值要与试卷要求的分值一致。\n  \n\n</instruction>\n\
            \n<example>\n输入文档：\n\"光合作用的原料是二氧化碳和水，产物是氧气和葡萄糖。\"\n\n输出：\n***光合作用的直接产物是什么？|多选|氧气;ATP;\
            \ 氮气; 水|氧气；葡萄糖|2.00|根据文档内容，光合作用的产物明确为氧气和葡萄糖\n***光合作用的原料是什么？|简答||二氧化碳和水|2.00|根据文档内容，光合作用的原料是二氧化碳和水\n\
            </example>"
