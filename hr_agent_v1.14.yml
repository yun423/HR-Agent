    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 简历筛选：根据评价模型，对简历进行评分，并分析简历的不合理之处
        model:
          completion_params:
            temperature: 0.7
            thinking: false
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: fdc3194e-ec29-4cb8-b265-0cc83e0c78ff
          role: system
          text: "<instruction>\n请根据以下步骤对简历进行评价和分析：\n\n1. **评价指标打分**：严格按简历评价标准中给出的指标对每个评价指标进行打分，并给出简短的评分理由。评分指标包括但不限于学历、工作经验、技能匹配度等。每个指标的打分格式为：\n\
            {\n\t\"评价指标\": \"指标名称\",\n\t\"score\": \"分数\",\n\t\"max\": \"当前指标最高分\"\
            ,\n\t\"reason\": \"评分理由\"\n}\n同时，还要把简历里面的一些元数据提取出来，如姓名（name)、应聘岗位(position)、工作年限(workYears)、教育水平(education)、毕业院校(school)、年龄(age)、性别(sex)\n\
